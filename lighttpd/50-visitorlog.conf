# Visitor log: clean URLs /check-in, /check-out, /admin served by Python CGI.
# mod_cgi is already loaded by 10-cgi.conf; mod_alias is loaded in lighttpd.conf.

$HTTP["url"] =~ "^/(check-in|check-out|admin)$" {
    cgi.assign = ( "" => "/usr/bin/python3" )
    alias.url += (
        "/check-in"  => "/var/www/cgi-bin/checkin.py",
        "/check-out" => "/var/www/cgi-bin/checkout.py",
        "/admin"     => "/var/www/cgi-bin/admin.py",
    )
}

# Admin page requires HTTP Basic Auth.
$HTTP["url"] =~ "^/admin$" {
    auth.backend = "htpasswd"
    auth.backend.htpasswd.userfile = "/etc/lighttpd/visitorlog.htpasswd"
    auth.require = ( "" => (
        "method"  => "basic",
        "realm"   => "Visitor Log Admin",
        "require" => "valid-user",
    ))
}
